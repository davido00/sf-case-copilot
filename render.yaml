# Render Blueprint. Lets the deployment be reviewed and version-controlled
# instead of living only as clicks in a dashboard.
#
# In Render: New > Blueprint > pick this repo. It reads this file, then prompts
# for the four secrets below (sync:false means "ask me, never store in git").
services:
  - type: web
    name: sf-case-copilot
    runtime: python
    plan: free           # sleeps after ~15 min idle; first call after that is slow
    region: frankfurt    # closest to Poland; change if you prefer
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn service.app:app --host 0.0.0.0 --port $PORT

    # Liveness only. Deliberately NOT /health -- see the docstring on /healthz.
    healthCheckPath: /healthz

    envVars:
      - key: DATA_SOURCE
        value: salesforce
      - key: SF_KNOWLEDGE_BODY_FIELD
        value: Answer__c

      - key: SF_DOMAIN
        value: login

      # sync:false = Render prompts for these and stores them encrypted.
      # None of them are ever committed. Copy the values from your local .env.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COPILOT_SHARED_SECRET
        sync: false

      # Salesforce auth. This project uses username + password + security
      # token, which does NOT expire (the token changes only when the password
      # does). The alternative is SF_ACCESS_TOKEN + SF_INSTANCE_URL from
      # `sf org display --json`, which avoids SOAP but expires within hours --
      # fine for local work, poor for a deployed service.
      - key: SF_USERNAME
        sync: false
      - key: SF_PASSWORD
        sync: false
      - key: SF_SECURITY_TOKEN
        sync: false
